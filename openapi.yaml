openapi: "3.1.0"
info:
  title: Notes API
  description: A minimal REST API for managing notes.
  version: "1.0.0"

paths:
  /notes:
    get:
      summary: List notes
      description: Returns a paginated list of all notes.
      parameters:
        - name: limit
          in: query
          description: Maximum number of notes to return (0–100, default all).
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: offset
          in: query
          description: Number of notes to skip before returning results (default 0).
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Successful response
          headers:
            X-Total-Count:
              description: Total number of notes in the collection (before pagination).
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      summary: Create a note
      description: >
        Creates a new note. Write endpoints are throttled to 60 requests per
        minute per IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notes/{id}:
    parameters:
      - name: id
        in: path
        description: Unique note identifier.
        required: true
        schema:
          type: integer

    get:
      summary: Get a note
      description: Retrieves a single note by ID.
      responses:
        "200":
          description: The requested note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update a note
      description: >
        Partially updates title and/or body of a note. Write endpoints are
        throttled to 60 requests per minute per IP address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      summary: Delete a note
      description: >
        Deletes a note. Write endpoints are throttled to 60 requests per
        minute per IP address.
      responses:
        "204":
          description: Note deleted successfully (no body)
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Returns this OpenAPI 3.1 specification as a YAML file.
      responses:
        "200":
          description: The OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string

components:
  schemas:
    Note:
      type: object
      required: [id, title, body]
      properties:
        id:
          type: integer
          description: Unique note identifier.
          example: 1
        title:
          type: string
          description: Note title.
          example: "Shopping list"
        body:
          type: string
          description: Note body text.
          example: "Milk, eggs, bread"

    NoteInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Note title (required).
          example: "Shopping list"
        body:
          type: string
          description: Note body text.
          example: "Milk, eggs, bread"

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
          description: New note title.
          example: "Shopping list"
        body:
          type: string
          description: New note body text.
          example: "Milk, eggs, bread"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.

  responses:
    BadRequest:
      description: Bad request – invalid or missing input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Note not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
